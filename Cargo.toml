[package]
name = "bat-device"
version = "0.2.0"
edition = "2024"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
opt-level = 3

[dependencies]
# Cortex-M 
cortex-m = { version ="0.7.7" }
cortex-m-rt = { version ="0.7.5" }

# Panic Handler
panic-probe = { version = "1.0.0" }

# Embassy
embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-thread",

    "embassy-time-driver",
    "executor-interrupt",
] }
embassy-time = { version = "0.5.0" }
embassy-rp = { version = "0.10.0", features = [
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
    "unstable-pac",
] }

embassy-usb-logger = {version = "0.6.0"}
log = {version = "0.4"}
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }
embassy-embedded-hal = { version = "0.6.0" }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
micromath = { version = "2.1.0" }
weather-utils = { version = "0.5.0", features = ["no-std"] }
embassy-sync = { version = "0.8.0" }
static_cell = { version = "2.1.1" }
derive_more = { version = "2", default-features = false, features=["display"]}
hcsr04_async = { version = "0.5.0" }
